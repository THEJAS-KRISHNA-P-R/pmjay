<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Midnight Teal to Vibrant Emerald -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="60%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Cross Gradient -->
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>

    <!-- Saffron Golden Core -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Subtle Elevation Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#021a19" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Modern Squircle Base (Apple / Google / Chrome style) -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Subtle Rim Light -->
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" />

  <!-- Minimalist Healthcare Rights Emblem -->
  <g filter="url(#shadow)">
    <!-- Outer Protective Shield Ribbon -->
    <path d="M 256 96 
             C 340 108 384 140 384 190 
             C 384 290 320 376 256 416 
             C 192 376 128 290 128 190 
             C 128 140 172 108 256 96 Z"
          fill="none"
          stroke="#ffffff"
          stroke-opacity="0.9"
          stroke-width="24"
          stroke-linejoin="round"
          stroke-linecap="round" />

    <!-- Rounded Medical Cross -->
    <!-- Horizontal arm -->
    <rect x="180" y="232" width="152" height="48" rx="24" fill="url(#crossGrad)" />
    <!-- Vertical arm -->
    <rect x="232" y="180" width="48" height="152" rx="24" fill="url(#crossGrad)" />

    <!-- Radiant Saffron Core Spark -->
    <circle cx="256" cy="256" r="16" fill="url(#goldGrad)" />
  </g>
</svg>
